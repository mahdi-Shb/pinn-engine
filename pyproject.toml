[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-engine"
version = "0.1.0"
description = "Experimental quantity, named-axis model, and derivative contracts for PINNs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]
notebook = ["matplotlib>=3.6", "ipython>=8", "jupyterlab>=4"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["contracts"]
packages = ["pinn_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
