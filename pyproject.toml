[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-engine"
version = "0.1.0"
description = "Experimental quantity, named-axis model, and derivative contracts for PINNs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]
notebook = ["matplotlib>=3.6", "ipython>=8", "jupyterlab>=4"]

[tool.setuptools]
license-files = ["LICENSE", "third_party/neural3dbench/LICENSE"]
py-modules = ["contracts"]
packages = [
  "pinn_engine", "pinn_engine.neural3dbench",
  "pinn_engine.neural3dbench.deep_nurbs", "pinn_engine.neural3dbench.fno",
  "pinn_engine.neural3dbench.gino", "pinn_engine.neural3dbench.graph",
  "pinn_engine.neural3dbench.graph.meshgraphnet", "pinn_engine.neural3dbench.pointnet",
  "pinn_engine.neural3dbench.pointnet2", "pinn_engine.neural3dbench.siren",
  "pinn_engine.neural3dbench.transolver", "pinn_engine.neural3dbench.unet3d",
]

[tool.setuptools.package-dir]
"" = "src"
"pinn_engine.neural3dbench" = "third_party/neural3dbench/models"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
