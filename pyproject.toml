[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn-engine"
version = "0.1.0"
description = "Experimental quantity, named-axis model, and derivative contracts for PINNs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]
geometry = ["numpy>=1.24", "scipy>=1.10", "numba>=0.58"]
mesh = ["trimesh>=4"]
notebook = ["matplotlib>=3.6", "ipython>=8", "jupyterlab>=4"]

[tool.setuptools]
package-dir = {"" = "src"}
license-files = ["LICENSE", "src/pinn_engine/networks/LICENSE", "src/geocore/_bin/LICENSE"]
py-modules = ["contracts"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["pinn_engine*", "geocore*"]
namespaces = false

[tool.setuptools.package-data]
"pinn_engine.networks" = ["LICENSE"]
geocore = ["_bin/LICENSE", "_bin/win-x64/*.dll", "_bin/osx-arm64/*.dylib", "_bin/linux-x64/*.so*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
